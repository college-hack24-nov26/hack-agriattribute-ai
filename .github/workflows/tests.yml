name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (undefined names, syntax)
        run: ruff check --select F821,F811,F63,F7 .
      - name: Unit tests (ROI maths, scenario simulator)
        run: pytest -q
      - name: Model report is reproducible
        run: python pipeline/evaluate_model.py
